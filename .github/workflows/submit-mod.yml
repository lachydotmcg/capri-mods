name: Submit a mod

# Turns an issue from the "Submit a mod" form into a pull request, so sharing a mod doesn't need git. Lachy still
# reads and merges every one. No issue text goes in a run line or an expression: tools/submit-mod.py reads the event
# file itself. Only the check job touches the downloads, and its token can only read.
on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: submit-mod-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'mod-submission') &&
      github.event.issue.user.type != 'Bot' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools

      # Reads the form, downloads its files from GitHub and runs tools/check-mods.py on the commit it would make.
      - id: check
        run: python3 -I tools/submit-mod.py check "$RUNNER_TEMP/submission"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submission
          path: ${{ runner.temp }}/submission
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  open-pr:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submission
          path: ${{ runner.temp }}/submission

      # Pushes mods/<id>/ to branch submit/<issue number>, opens or updates its pull request and comments the link.
      - run: python3 -I tools/submit-mod.py open-pr "$RUNNER_TEMP/submission"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  explain:
    needs: check
    if: needs.check.outputs.ok == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submission
          path: ${{ runner.temp }}/submission

      # One comment on the issue that lists what to fix.
      - run: python3 -I tools/submit-mod.py explain "$RUNNER_TEMP/submission"
        env:
          GITHUB_TOKEN: ${{ github.token }}
